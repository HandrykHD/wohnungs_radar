[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI nutzt Funktionsaufrufe als Default-Argumente (Depends)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Projektwurzel in den Importpfad, damit "import app" ohne Installation greift.
pythonpath = ["."]
